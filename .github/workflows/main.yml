name: Dubai Real Estate MLOps
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn mlflow dagshub
        
      - name: 🚀 Generate Data AND Train Model
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Create directory first
          mkdir -p data
          # Run generator
          python src/generate_data.py
          # Verify file exists before training
          ls -l data/
          # Run trainer
          python src/train.py
