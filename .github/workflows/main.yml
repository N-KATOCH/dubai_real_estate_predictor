name: Dubai Real Estate MLOps
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  train-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Run Monitoring
        # We add 'continue-on-error' so that if monitoring fails, 
        # the model still trains and logs to DagsHub.
        continue-on-error: true 
        run: python src/monitor.py
        
      - name: Run Training & Log to DagsHub
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/dubai_real_estate_predictor.mlflow
        run: python src/train.py

      - name: Upload Drift Report to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dubai-real-estate-reports
          path: reports/data_drift_report.html
